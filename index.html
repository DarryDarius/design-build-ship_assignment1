<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>First Winter Club — 25 Versions</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 48px 24px; color: #111; }
    h1 { margin: 0 0 8px; }
    .lede { color: #555; max-width: 60ch; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 40px; }
    .card { display: block; text-decoration: none; color: inherit; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    .card:hover { border-color: #111; }
    .card b { display: block; margin-bottom: 4px; }
    .card span { font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <h1>First Winter Club</h1>
  <p class="lede">25 versions of a landing page for international students facing their first Chicago winter. The story of how I got to the final one.</p>
  <div class="grid">
    <!-- versions are added here batch by batch -->
  </div>
</body>
</html>
